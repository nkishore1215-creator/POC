# Sending email still requires both environment variables to be set.
spring.mail.username=${MAIL_USERNAME:nkishore.1215@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:wunosnthzwwpocvw}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:nkishore.1215@gmail.com}}

app.frontend.cart-url=http://localhost:5173

# AI-personalized recovery copy is opt-in. With AI disabled or unavailable, the
# application automatically sends its deterministic recovery template.
ai.recovery.enabled=${AI_RECOVERY_ENABLED:true}
ai.recovery.openai.api-key=${OPENAI_API_KEY:}
ai.recovery.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
ai.recovery.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# A product may be described as popular only after this many units were purchased in the last month.
ai.recovery.social-proof.high-sales-threshold=${HIGH_SALES_THRESHOLD:5}




spring.kafka.bootstrap-servers=localhost:9092
# Keep consumers stopped unless Kafka listening is explicitly enabled.
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_ENABLED:false}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=cart-recovery-notification-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.cartrecovery.*
spring.kafka.consumer.auto-offset-reset=latest
