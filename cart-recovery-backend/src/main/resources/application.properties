spring.application.name=cart-recovery-backend
server.port=${SERVER_PORT:8081}

# PostgreSQL (active) - using update to create missing tables
spring.datasource.url=jdbc:postgresql://localhost:5432/cart_recovery
spring.datasource.username=postgres
spring.datasource.password=Tiger@123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public

# Apply versioned database fixes to existing PostgreSQL schemas.
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# H2 in-memory database (commented out - uncomment to use H2 instead)
# spring.datasource.url=jdbc:h2:mem:cart_recovery_db
# spring.datasource.driverClassName=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mark a non-empty active cart abandoned after three minutes without activity.
abandoned.cart.idle-timeout=PT20S
# How frequently the scheduler checks for idle carts and due reminders.
abandoned.cart.scan-interval=PT10S
# Wait this long after application startup before the first abandonment scan.
abandoned.cart.initial-delay=PT5S
# Send the first reminder this long after the cart is marked abandoned.
abandoned.cart.first-reminder-delay=PT1M
# Send the second reminder this long after the first reminder succeeds.
# Use a longer value such as PT24H in production.
abandoned.cart.second-reminder-delay=PT2M
# Expire an unrecovered cart five minutes after the second reminder succeeds.
abandoned.cart.expiration-delay=PT5M
# Prefix used for the unique discount code included in the second reminder.
abandoned.cart.discount-code-prefix=RECOVER
# Recovery discount tiers based on the cart total.
abandoned.cart.discount.two-percent-minimum=500
abandoned.cart.discount.five-percent-minimum=1000
abandoned.cart.discount.ten-percent-minimum=2000
# Keep the first reminder offer-free; the discount code is created for the second reminder.
abandoned.cart.first-reminder-offer-enabled=false
# Merchant-approved text passed to AI only when a real recovery code exists.
abandoned.cart.offer-description=${RECOVERY_OFFER_DESCRIPTION:Recovery discount available}
# Encouragement shown in every reminder without claiming a specific accessory discount.
abandoned.cart.accessory-offer-message=${ACCESSORY_OFFER_MESSAGE:Complete your setup and explore special offers on other accessories.}

# Email Configuration (Gmail SMTP)
# NOTE: For Gmail, you must use an "App Password" instead of your regular password
# Steps to generate App Password:
# 1. Go to https://myaccount.google.com/security
# 2. Enable 2-Step Verification (if not already enabled)
# 3. Go to App passwords (bottom of Security page)
